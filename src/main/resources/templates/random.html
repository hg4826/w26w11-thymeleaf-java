<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thymeleaf</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="min-h-screen bg-slate-100 flex items-center justify-center">
    <div class="w-full max-w-sm rounded-2xl bg-white p-8 shadow-lg">
        <h2 class="mb-6 text-2xl font-bold text-indigo-600">추천 노래</h2>
        <p class="mb-2 text-slate-700">제목: <span class="font-semibold text-slate-900" th:text="${song.title}">Cosmic Echo</span></p>
        <p class="mb-2 text-slate-700">가수: <span class="font-semibold text-slate-900" th:text="${song.singer}">Nova</span></p>
        <p class="text-slate-700">평점: <span class="font-semibold text-amber-500" th:text="${song.rating}">5</span></p>
        <a href="/songs" class="mt-6 inline-block text-sm text-indigo-500 hover:underline">전체 목록 보기 →</a>
    </div>
</body>
</html>
